<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hub - Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--border:#2a2a3a;--accent:#7c6aff;--accent2:#ff6a9a;--accent3:#6affd4;--text:#e8e8f0;--text-dim:#8888a0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}
  #sidebar{width:270px;min-width:270px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;overflow:hidden;}
  .logo{padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .logo h1{font-size:21px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .logo p{font-size:10px;color:var(--text-dim);font-family:'Space Mono',monospace;margin-top:2px;}
  .slabel{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-dim);padding:0 20px 8px;text-transform:uppercase;}
  .bot-list{padding:0 10px;flex:1;overflow-y:auto;}
  .bot-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:3px;border:1px solid transparent;}
  .bot-item:hover{background:var(--surface2);}
  .bot-item.active{background:var(--surface2);border-color:var(--border);}
  .bot-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;object-fit:cover;}
  .bot-info{overflow:hidden;flex:1;}
  .bot-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bot-mtag{font-size:10px;color:var(--text-dim);font-family:'Space Mono',monospace;}
  .api-sec{padding:12px 10px 0;border-top:1px solid var(--border);overflow-y:auto;}
  .arow{margin-bottom:7px;}
  .alabel{font-size:10px;color:var(--text-dim);font-family:'Space Mono',monospace;margin-bottom:3px;display:block;}
  .ainput{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-family:'Space Mono',monospace;font-size:10px;outline:none;transition:border-color .2s;}
  .ainput:focus{border-color:var(--accent);}
  .save-btn{width:100%;padding:8px;background:var(--accent);border:none;border-radius:8px;color:white;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:opacity .2s;margin-top:6px;margin-bottom:8px;}
  .save-btn:hover{opacity:.85;}
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .chat-hdr{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface);}
  .hdr-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;}
  .hdr-info h2{font-size:15px;font-weight:700;}
  .hdr-info p{font-size:11px;color:var(--text-dim);font-family:'Space Mono',monospace;}
  .hdr-acts{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .msel{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;outline:none;}
  .hdr-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-family:'Syne',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;}
  .hdr-btn:hover{border-color:var(--accent2);color:var(--accent2);}
  #messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;}
  #messages::-webkit-scrollbar{width:4px;}
  #messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .msg{display:flex;gap:10px;animation:fu .3s ease;}
  .msg.user{flex-direction:row-reverse;align-self:flex-end;max-width:80%;}
  .msg.bot{align-self:flex-start;max-width:85%;}
  @keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .mavatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px;}
  .mbubble{padding:11px 15px;border-radius:13px;font-size:13.5px;line-height:1.65;word-break:break-word;}
  .msg.user .mbubble{background:#1e1a3a;border:1px solid var(--accent)44;border-bottom-right-radius:3px;}
  .msg.bot .mbubble{background:#131320;border:1px solid var(--border);border-bottom-left-radius:3px;}
  .mbubble img{max-width:100%;border-radius:8px;margin-top:8px;}
  .mbubble pre{background:#0d0d15;border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0;font-family:'Space Mono',monospace;font-size:12px;line-height:1.5;}
  .mbubble code{font-family:'Space Mono',monospace;font-size:12px;background:#0d0d15;padding:2px 5px;border-radius:4px;}
  .mbubble pre code{background:none;padding:0;}
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:10px;}
  .input-area{padding:14px 22px 18px;border-top:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:10px;}
  .preview-wrap{display:none;position:relative;width:fit-content;}
  .preview-wrap img{height:60px;border-radius:8px;border:1px solid var(--border);}
  .preview-rm{position:absolute;top:-8px;right:-8px;background:var(--accent2);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .input-wrap{display:flex;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:9px 13px;align-items:flex-end;}
  .input-wrap:focus-within{border-color:var(--accent)88;}
  .attach-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;transition:color .2s;}
  .attach-btn:hover{color:var(--accent);}
  .attach-btn svg{width:20px;height:20px;fill:currentColor;}
  #ui{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Syne',sans-serif;font-size:14px;resize:none;max-height:120px;line-height:1.5;padding:4px 0;}
  #ui::placeholder{color:var(--text-dim);}
  #sb{width:34px;height:34px;border-radius:9px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
  #sb:hover{opacity:.85;}
  #sb svg{width:15px;height:15px;fill:white;}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;z-index:200;transform:translateY(16px);opacity:0;transition:all .3s;pointer-events:none;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.ok{border-color:var(--accent3)88;color:var(--accent3);}
  .toast.err{border-color:var(--accent2)88;color:var(--accent2);}
</style>
</head>
<body>
<div id="sidebar">
  <div class="logo"><h1>⚡ AI Hub</h1><p>your personal ai workspace</p></div>
  <div class="slabel">Bot của bạn</div>
  <div class="bot-list" id="botList"></div>
  <div class="api-sec">
    <div class="slabel" style="padding:0 10px 8px">API Key</div>
    <div class="arow">
      <label class="alabel">🌌 OpenRouter</label>
      <input class="ainput" type="password" id="kor" placeholder="sk-or-v1-..."/>
    </div>
    <button class="save-btn" onclick="saveKeys()">💾 Lưu API Key</button>
  </div>
</div>
<div id="main">
  <div class="chat-hdr">
    <div class="hdr-icon" id="hIcon" style="background:#1c1c26">🤖</div>
    <div class="hdr-info"><h2 id="hName">Chọn một bot</h2><p id="hModel">để bắt đầu chat</p></div>
    <div class="hdr-acts">
      <select class="msel" id="msel" onchange="changeModel(this.value)" style="display:none"></select>
      <button class="hdr-btn" onclick="clearChat()">🗑 Xóa chat</button>
    </div>
  </div>
  <div id="messages">
    <div class="welcome"><h2>AI Hub</h2><p>Chọn bot bên trái để bắt đầu.</p></div>
  </div>
  <div class="input-area">
    <div class="preview-wrap" id="imgPreviewWrap">
      <img id="imgPreview" src="" alt="preview"/>
      <button class="preview-rm" onclick="removeImg()">✕</button>
    </div>
    <div class="input-wrap">
      <input type="file" id="fileInp" accept="image/*" style="display:none" onchange="handleFile(event)"/>
      <button class="attach-btn" onclick="document.getElementById('fileInp').click()" title="Đính kèm ảnh">
        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-3.31-2.69-6-6-6S3 1.69 3 5v11.5c0 3.86 3.14 7 7 7s7-3.14 7-7V6h-1.5z"/></svg>
      </button>
      <textarea id="ui" placeholder="Nhắn tin (hỗ trợ kéo thả ảnh)..." rows="1" onkeydown="hk(event)" oninput="ar(this)"></textarea>
      <button id="sb" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// --- CẤU HÌNH MODELS ---
const MODELS = {
  'claude-sonnet': { l: 'Claude 3.5 Sonnet', m: 'anthropic/claude-3.5-sonnet' },
  'gpt-4o': { l: 'GPT-4o', m: 'openai/gpt-4o' }
};

// Xóa cache cũ để nhận danh sách Bot mới
localStorage.removeItem('ahb');

let bots = [
  {
    id: 1, name: 'Tech Lead (Claude)', emoji: '💻', color: '#7c6aff', model: 'claude-sonnet',
    prompt: 'Bạn là một Senior Tech Lead và AI Assistant. Người dùng có nền tảng quản lý dự án phần mềm và hiểu biết hệ thống tốt. Nhiệm vụ của bạn là hỗ trợ viết code, debug qua ảnh chụp màn hình, review kiến trúc và đưa ra giải pháp kỹ thuật tích hợp. Giải thích ngắn gọn, logic, thẳng vào vấn đề. Luôn cung cấp clean code.'
  },
  {
    id: 2, name: 'Quản lý FO & Email', emoji: '📧', color: '#6ab4ff', model: 'claude-sonnet',
    prompt: 'Bạn là Trợ lý Quản lý Tiền sảnh (Front Office Manager) tại khu nghỉ dưỡng 5 sao ở Đà Nẵng. Hãy soạn và phản hồi email cho khách lưu trú hoặc đối tác với văn phong chuyên nghiệp, sang trọng, hiếu khách. Cung cấp sẵn Tiêu đề (Subject). Hỗ trợ xử lý khéo léo các tình huống dịch vụ.'
  },
  {
    id: 3, name: 'Vận hành & SOP', emoji: '📝', color: '#ff6a9a', model: 'gpt-4o',
    prompt: 'Bạn là chuyên gia Vận hành khu nghỉ dưỡng phức hợp. Hỗ trợ xây dựng, chuẩn hóa quy trình SOP, tài liệu hướng dẫn nhân sự cho các khu vực như: Lễ tân, Gym, Hồ bơi, Sân tập thể thao (Tennis/Golf) và Kid Club. Trình bày rành mạch, có tính thực tiễn cao để áp dụng ngay.'
  }
];

let keys = JSON.parse(localStorage.getItem('ahk') || '{}');
let cur = null, am = null, hist = JSON.parse(localStorage.getItem('ahh') || '{}');
let loading = false;
let attachedImage = null;

function init() {
  renderList();
  if (keys.openrouter) document.getElementById('kor').value = keys.openrouter;
}

function saveKeys() {
  keys = { openrouter: document.getElementById('kor').value.trim() };
  localStorage.setItem('ahk', JSON.stringify(keys));
  toast('✅ Đã lưu API Key!', 'ok');
}

function renderList() {
  document.getElementById('botList').innerHTML = bots.map(b => {
    return `<div class="bot-item ${cur?.id === b.id ? 'active' : ''}" onclick="selBot(${b.id})">
      <div class="bot-icon" style="background:${b.color}22">${b.emoji}</div>
      <div class="bot-info"><div class="bot-name">${b.name}</div><div class="bot-mtag">${MODELS[b.model].l}</div></div>
    </div>`;
  }).join('');
}

function selBot(id) {
  cur = bots.find(b => b.id === id); if (!cur) return;
  am = cur.model; updateHdr(); renderList(); renderMsgs();
}

function updateHdr() {
  if (!cur) return;
  document.getElementById('hIcon').textContent = cur.emoji;
  document.getElementById('hIcon').style.background = cur.color + '22';
  document.getElementById('hName').textContent = cur.name;
  document.getElementById('hModel').textContent = MODELS[am].l;
  const sel = document.getElementById('msel');
  sel.style.display = 'block';
  sel.innerHTML = Object.entries(MODELS).map(([k, v]) => `<option value="${k}" ${k === am ? 'selected' : ''}>${v.l}</option>`).join('');
}

function changeModel(v) { am = v; document.getElementById('hModel').textContent = MODELS[v].l; toast('🔄 Đã đổi model', 'ok'); }

// --- XỬ LÝ ẢNH ---
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    attachedImage = event.target.result;
    document.getElementById('imgPreview').src = attachedImage;
    document.getElementById('imgPreviewWrap').style.display = 'block';
    document.getElementById('ui').focus();
  };
  reader.readAsDataURL(file);
}

function removeImg() {
  attachedImage = null;
  document.getElementById('imgPreviewWrap').style.display = 'none';
  document.getElementById('fileInp').value = '';
}

// Xử lý kéo thả ảnh vào khung chat
const ui = document.getElementById('ui');
ui.addEventListener('dragover', e => { e.preventDefault(); ui.style.borderColor = 'var(--accent)'; });
ui.addEventListener('dragleave', e => { e.preventDefault(); ui.style.borderColor = 'transparent'; });
ui.addEventListener('drop', e => {
  e.preventDefault(); ui.style.borderColor = 'transparent';
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    document.getElementById('fileInp').files = e.dataTransfer.files;
    handleFile({target: {files: e.dataTransfer.files}});
  }
});

function renderMsgs() {
  const c = document.getElementById('messages');
  const h = hist[cur.id] || [];
  if (!h.length) {
    c.innerHTML = `<div class="welcome"><div style="font-size:46px;margin-bottom:10px">${cur.emoji}</div><h2>${cur.name}</h2><p style="color:var(--text-dim);font-size:13px;max-width:400px;margin-top:10px">${cur.prompt}</p></div>`;
    return;
  }
  c.innerHTML = h.map(m => `<div class="msg ${m.r}">
    <div class="mavatar" style="background:${m.r === 'user' ? '#1e1a3a' : cur.color + '22'}">${m.r === 'user' ? '👤' : cur.emoji}</div>
    <div class="mbubble">
      ${m.img ? `<img src="${m.img}" alt="upload"/><br>` : ''}
      ${fmt(m.c)}
    </div>
  </div>`).join('');
  c.scrollTop = c.scrollHeight;
}

function fmt(t) {
  t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<pre><code>${c.trim()}</code></pre>`);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

function clearChat() {
  if (!cur || !confirm(`Xóa lịch sử chat này?`)) return;
  hist[cur.id] = []; localStorage.setItem('ahh', JSON.stringify(hist)); renderMsgs();
}

async function send() {
  if (loading || !cur) return;
  const inp = document.getElementById('ui');
  const txt = inp.value.trim();
  if (!txt && !attachedImage) return;

  const currentImg = attachedImage; // Lưu biến tạm để đẩy vào mảng
  inp.value = ''; inp.style.height = 'auto'; removeImg();

  if (!hist[cur.id]) hist[cur.id] = [];
  hist[cur.id].push({ r: 'user', c: txt, img: currentImg });
  localStorage.setItem('ahh', JSON.stringify(hist));
  renderMsgs();

  const c = document.getElementById('messages');
  c.insertAdjacentHTML('beforeend', `<div class="msg bot" id="ty"><div class="mavatar" style="background:${cur.color}22">${cur.emoji}</div><div class="mbubble" style="color:var(--text-dim)">Đang xử lý...</div></div>`);
  c.scrollTop = c.scrollHeight;
  loading = true; document.getElementById('sb').disabled = true;

  try {
    const rep = await callWorker(am, cur.prompt, hist[cur.id]);
    document.getElementById('ty')?.remove();
    hist[cur.id].push({ r: 'bot', c: rep });
  } catch (err) {
    document.getElementById('ty')?.remove();
    hist[cur.id].push({ r: 'bot', c: '⚠️ Lỗi: ' + err.message });
    toast('❌ Lỗi API', 'err');
  }
  
  localStorage.setItem('ahh', JSON.stringify(hist));
  renderMsgs();
  loading = false; document.getElementById('sb').disabled = false;
  inp.focus();
}

async function callWorker(mk, sys, h) {
  const m = MODELS[mk];
  const apiKey = keys.openrouter;
  if (!apiKey) throw new Error('Chưa nhập OpenRouter API key ở Sidebar!');

  const msgs = [{ role: 'system', content: sys }];
  
  h.forEach(x => {
    let msgContent = x.c;
    // Nếu tin nhắn user có ảnh, chuyển format sang dạng array hỗ trợ Vision
    if (x.r === 'user' && x.img) {
      msgContent = [];
      if (x.c) msgContent.push({ type: "text", text: x.c });
      msgContent.push({ type: "image_url", image_url: { url: x.img } });
    }
    msgs.push({ role: x.r === 'bot' ? 'assistant' : 'user', content: msgContent });
  });

  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${apiKey}`,
      'Content-Type': 'application/json',
      'HTTP-Referer': window.location.href,
      'X-Title': 'AI Hub'
    },
    body: JSON.stringify({ model: m.m, messages: msgs })
  });

  const data = await res.json();
  if (data.error) throw new Error(data.error.message || 'Lỗi OpenRouter');
  return data.choices[0].message.content;
}

function hk(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function ar(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
</body>
</html>
